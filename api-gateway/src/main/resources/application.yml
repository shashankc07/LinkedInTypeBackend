spring.application.name: api-gateway

server.port: 8081

jwt.secretKey: nkcjnaisuchhc89yf289fhjdsckjbe2uc92bcionsacondsv98c3h9v3jzbc236t478234rv3ovb

#Eureka server config
eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: lb://POSTS-SERVICE
          predicates:
          - Path=/api/v1/posts/**
          filters:
          - StripPrefix=2
          - name: AuthenticationFilter

        - id: connections-service
          uri: lb://CONNECTIONS-SERVICE
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter