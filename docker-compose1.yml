version: "3.8"

services:
  kafka:
    image: docker.io/apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    volumes:
      - "kafka_data:/apache"
    networks:
      - linkedin-network
    environment:
      #KRaft settings
      - KAFKA_KRAFT_MODE:true
      - KAFKA_PROCESS_ROLES:"controller,broker"
      - KAFKA_NODE_ID:0
      - KAFKA_CONTROLLER_QUORUM_VOTERS:"0@kafka:9093"
      #Listeneres
      - KAFKA_LISTENERS:"PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093"
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:"PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      - KAFKA_INTER_BROKER_LISTENER_NAME:"PLAINTEXT"
      - KAFKA_CONTROLLER_LISTENER_NAMES:"CONTROLLER"
      - KAFKA_ADVERTISED_LISTENERS:"PLAINTEXT://kafka:9092"
      - CLUSTER_ID:"<generated-uuid>"

  kafbat-ui:
    container_name: kafbat_ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    networks:
      - linkedin-network
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb1:8088

  notification-db:
    image: postgres
    container_name: notification-db
    environment:
      - POSTGRES_DB=notificationsDB
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    networks:
      - linkedin-network
    volumes:
      - notifications-db-data:/var/lib/postgresql/data

  posts-db:
    image: postgres
    container_name: posts-db
    environment:
      - POSTGRES_DB=postsDB
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    networks:
      - linkedin-network
    volumes:
      - posts-db-data:/var/lib/postgresql/data

  user-db:
    image: postgres
    container_name: user-db
    environment:
      - POSTGRES_DB=usersDB
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    networks:
      - linkedin-network
    volumes:
      - users-db-data:/var/lib/postgresql/data

  connections-db:
    image: neo4j
    container_name: connections-db
    environment:
      - NEO4J_AUTH=neo4j/shashank@123  # Set username / password
    ports:
      - "7474:7474"  # HTTP port
      - "7687:7687"  # Bolt port
    volumes:
      - connections-db-data:/data   #persisting data
    networks:
      - linkedin-network

  discovery-server:
    image: shashankc7/linkedin-app/discovery-server:1.0.0
    container_name: discovery-server
    networks:
      - linkedin-network
    ports:
      - "8761:8761"

  posts-service:
    image: shashankc7/linkedin-app/posts-service:1.0.0
    container_name: posts-service
    networks:
      - linkedin-network
    depends_on:
      - posts-db
      - discovery-server
      - kafka

  user-service:
    image: shashankc7/linkedin-app/users-service:1.0.0
    container_name: user-service
    networks:
      - linkedin-network
    depends_on:
      - user-db
      - discovery-server

  connections-service:
    image: shashankc7/linkedin-app/connections-service:1.0.0
    container_name: connections-service
    networks:
      - linkedin-network
    depends_on:
      - connections-db
      - discovery-server
      - kafka

  notification-service:
    image: shashankc7/linkedin-app/notification-service:1.0.0
    container_name: notification-service
    networks:
      - linkedin-network
    depends_on:
      - notification-db
      - discovery-server
      - kafka

  api-gateway:
    image: shashankc7/linkedin-app/api-gateway:1.0.0
    container_name: api-gateway
    ports:
      - "8081:8081"
    networks:
      - linkedin-network
    depends_on:
      - discovery-server

networks:
  linkedin-network:

volumes:
  kafka_data:
  notifications-db-data:
  posts-db-data:
  users-db-data:
  connections-db-data:
